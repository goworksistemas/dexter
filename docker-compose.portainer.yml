services:
  agentcore:
    image: ghcr.io/goworksistemas/dexter-agentcore:latest
    container_name: dexter-agentcore
    restart: unless-stopped
    environment:
      INFISICAL_API_URL: https://vault.gowork.com.br
      INFISICAL_PROJECT_ID: 578a6937-020f-4d07-9eb7-474c6bec3c0a
      INFISICAL_ENV: prod
      INFISICAL_SECRET_PATH: /
      # Só bootstrap Infisical (Machine Identity / Service Token) — secrets de app vêm do vault
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  web:
    image: ghcr.io/goworksistemas/dexter-web:latest
    container_name: dexter-web
    restart: unless-stopped
    depends_on:
      agentcore:
        condition: service_healthy
    networks:
      - internal
      - dexter
    labels:
      - traefik.enable=true
      - traefik.docker.network=dexter
      - traefik.http.routers.dexter.rule=Host(`dexter.gowork.com.br`)
      - traefik.http.routers.dexter.entrypoints=websecure
      - traefik.http.routers.dexter.tls=true
      - traefik.http.routers.dexter.tls.certresolver=leresolver
      - traefik.http.services.dexter.loadbalancer.server.port=80

  redis:
    image: redis:7-alpine
    container_name: dexter-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:

networks:
  internal:
    driver: bridge
  dexter:
    external: true
