services:
  agentcore:
    image: ghcr.io/goworksistemas/dexter-agentcore:latest
    container_name: dexter-agentcore
    restart: unless-stopped
    environment:
      INFISICAL_API_URL: https://vault.gowork.com.br
      INFISICAL_PROJECT_ID: 578a6937-020f-4d07-9eb7-474c6bec3c0a
      INFISICAL_ENV: prod
      INFISICAL_SECRET_PATH: /
      # Só bootstrap Infisical (Machine Identity / Service Token) — secrets de app vêm do vault
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      REDIS_URL: redis://redis:6379
      # Busca na internet (tools web__search/web__fetch) — o backend também
      # descobre sozinho, mas deixamos explícito.
      SEARXNG_BASE_URL: http://searxng:8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3

  web:
    image: ghcr.io/goworksistemas/dexter-web:latest
    container_name: dexter-web
    restart: unless-stopped
    depends_on:
      agentcore:
        condition: service_healthy
    networks:
      - internal
      - dexter
    labels:
      - traefik.enable=true
      - traefik.docker.network=dexter
      - traefik.http.routers.dexter.rule=Host(`dexter.gowork.com.br`)
      - traefik.http.routers.dexter.entrypoints=websecure
      - traefik.http.routers.dexter.tls=true
      - traefik.http.routers.dexter.tls.certresolver=leresolver
      - traefik.http.services.dexter.loadbalancer.server.port=80

  redis:
    image: redis:7-alpine
    container_name: dexter-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Busca na internet do Dexter (tools web__search/web__fetch) — gratuita,
  # zero config: o init grava o settings.yml (formato json + secret gerado)
  # e o serviço sobe pronto. Só na rede interna.
  searxng-init:
    image: alpine:3.20
    container_name: dexter-searxng-init
    command:
      - sh
      - -c
      - |
        if [ ! -f /etc/searxng/settings.yml ]; then
          KEY=$$(head -c 32 /dev/urandom | sha256sum | cut -d' ' -f1)
          printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\nsearch:\n  formats:\n    - html\n    - json\n' "$$KEY" > /etc/searxng/settings.yml
        fi
    volumes:
      - searxng-config:/etc/searxng
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    container_name: dexter-searxng
    restart: unless-stopped
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    volumes:
      - searxng-config:/etc/searxng
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/healthz || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  redis-data:
  searxng-config:

networks:
  internal:
    driver: bridge
  dexter:
    external: true
