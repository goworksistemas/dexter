<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/dexter.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <title>Dexter</title>
    <meta name="theme-color" content="#eef2f9" />
    <!-- Bootstrap de tema: aplica `.dark` antes do primeiro paint para evitar
         flash claro no reload (mesma chave do ThemeProvider: dexter-theme). -->
    <script>
      try {
        var t = localStorage.getItem("dexter-theme")
        var dark =
          t === "dark" ||
          ((!t || t === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) {
          document.documentElement.classList.add("dark")
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute("content", "#0a0d0f")
        }
      } catch (e) {
        /* localStorage indisponível — segue no tema claro */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
