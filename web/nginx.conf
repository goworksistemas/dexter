server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # MIME types explícitos (evita text/plain quebrando CSS/JS no browser)
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/javascript js mjs;
    text/css css;
  }

  # Assets com hash: nunca cair no fallback SPA (404 real se faltar)
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location = /favicon.svg {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  # AgentCore na mesma origem
  location /api/ {
    proxy_pass http://agentcore:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
  }

  location = /healthz {
    proxy_pass http://agentcore:8787/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA — deep-links (/c/:id, /settings, /auth/*)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
