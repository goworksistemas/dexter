name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

# Cancela execuções anteriores do mesmo PR ou push em develop
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager no package.json da raiz fixa pnpm@10.32.1 via Corepack
      - name: Habilitar Corepack (pnpm)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes (agentcore-server)
        run: pnpm --filter agentcore-server test
