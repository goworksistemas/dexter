name: Make GHCR packages public

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish images (GHCR)"]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  public:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for pkg in dexter-agentcore dexter-web; do
            echo "→ $pkg"
            gh api -X PUT "/user/packages/container/${pkg}/visibility" -f visibility=public \
              || gh api -X PUT "/orgs/goworksistemas/packages/container/${pkg}/visibility" -f visibility=public \
              || true
            # fallback: repo-linked package URL encode
            gh api -X PUT "/user/packages/container/${pkg}/visibility" \
              -H "Accept: application/vnd.github+json" \
              -f visibility=public || echo "WARN: não conseguiu publicizar $pkg"
          done
