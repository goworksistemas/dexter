# AgentCore — stack de deploy (Portainer / DigitalOcean).
#
# IMPORTANTE sobre segredos:
#   O `env_file: .env` abaixo é para uso LOCAL (dev/homolog na máquina do
#   dev, com um .env não commitado — veja .env.example).
#   Em PRODUÇÃO (Portainer), os segredos (ANTHROPIC_API_KEY,
#   SUPABASE_SERVICE_ROLE_KEY, SUPABASE_URL, etc.) NÃO vêm de um .env
#   commitado: são injetados pelo Infisical (projeto "agentcore") via
#   variáveis de ambiente da stack/serviço no próprio Portainer. Se o
#   arquivo .env não existir no host de produção, remova/ajuste a chave
#   `env_file` e configure as variáveis diretamente na stack do Portainer.
#
# Redis alimenta a fila BullMQ (sumarização do histórico, embeddings do RAG e
# execução dos workflows agendados) e o rate limit por usuário do /api/chat.
# É OPCIONAL: sem REDIS_URL o AgentCore roda tudo in-process — a fila é upgrade
# (retry, multi-réplica), não dependência.

services:
  agentcore:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentcore-server:latest
    container_name: agentcore
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      # Fila BullMQ + rate limit por usuário (ver comentário acima).
      # Sobrescreva/injete via Infisical/Portainer em produção.
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: agentcore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
